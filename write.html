
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write | mellow</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #F7F6F0;
    color: #292d2a;
    font-family: Arial, "Noto Sans KR", sans-serif;
    line-height: 1.8;
}

a {
    color: inherit;
    text-decoration: none;
}

header {
    height: 76px;
    border-bottom: 1px solid #e8e7df;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 9%;
}

.logo {
    font-size: 23px;
    font-weight: 800;
}

.logo span {
    color: #63866c;
}

.container {
    max-width: 850px;
    margin: 70px auto;
    padding: 0 25px;
}

h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.description {
    color: #858a84;
    margin-bottom: 40px;
}

form {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

label {
    font-size: 14px;
    font-weight: bold;
    display: block;
    margin-bottom: 8px;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #deded5;
    background: white;
    font-size: 14px;
    font-family: inherit;
    border-radius: 5px;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #63866c;
}

textarea {
    min-height: 350px;
    resize: vertical;
}

button {
    background: #63866c;
    color: white;
    border: none;
    padding: 14px 25px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #4d7056;
}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
}

.cancel {
    background: #deded5;
    color: #444;
}

@media(max-width:700px) {
    header {
        padding: 0 20px;
    }

    .container {
        margin: 45px auto;
    }

    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">mellow<span>.</span></a>
    <a href="index.html">← Back to Blog</a>
</header>

<main class="container">

    <h1>Write a Post</h1>
    <p class="description">
        새롭게 배운 내용과 경험을 기록해 보세요.
    </p>

    <form id="postForm">

        <div>
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="게시글 제목을 입력하세요." required>
        </div>

        <div>
            <label for="category">Category</label>
            <select id="category" required>
                <option value="">카테고리를 선택하세요.</option>
                <option value="Development">Development</option>
                <option value="CTF / Wargame">CTF / Wargame</option>
                <option value="Bug Bounty">Bug Bounty</option>
                <option value="Technical Notes">Technical Notes</option>
                <option value="Papers / Conferences">Papers / Conferences</option>
                <option value="Activities / Certifications">Activities / Certifications</option>
            </select>
        </div>

        <div>
            <label for="content">Content</label>
            <textarea id="content" placeholder="오늘 배운 내용을 기록해 보세요." required></textarea>
        </div>

        <div class="buttons">
            <button type="button" class="cancel" onclick="location.href='index.html'">취소</button>
            <button type="submit">게시글 등록</button>
        </div>

    </form>

</main>

<script>
document.getElementById("postForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("글쓰기 화면 테스트 완료! GitHub 저장 기능은 다음 단계에서 연결합니다.");
});
</script>

</body>
</html>
